<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Profile 2026 · Techashi Solutions Ltd.</title>
  <link rel="icon" type="image/png" href="assets/logo-emblem.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#075293',
              'blue-dark': '#043A6B',
              'blue-deep': '#03213D',
              'blue-light': '#EBF4FC',
              green: '#8EC640',
              'green-dark': '#74A72E',
              'green-deep': '#4C7317',
              'green-light': '#F3F9EA',
              charcoal: '#0F172A',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b1320;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-100 antialiased">

  <!-- Top Enterprise Navigation & Action Bar -->
  <header class="h-14 sm:h-16 bg-brand-blue-deep border-b border-slate-800/80 px-3 sm:px-6 flex items-center justify-between shrink-0 z-30 shadow-md">
    
    <!-- Left: Back Navigation & Brand -->
    <div class="flex items-center gap-3 sm:gap-4">
      <a href="/" class="inline-flex items-center gap-2 text-xs sm:text-sm font-semibold text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg hover:bg-white/5 transition-all" title="Return to Techashi Home">
        <i data-lucide="arrow-left" class="w-4 h-4 text-brand-green"></i>
        <span class="hidden xs:inline">Back to</span> <span>Home</span>
      </a>

      <div class="h-5 w-px bg-slate-700/80 hidden sm:block"></div>

      <div class="flex items-center gap-2.5">
        <img src="assets/logo-emblem.png" alt="Techashi" class="w-7 h-7 object-contain">
        <div class="hidden md:block">
          <h1 class="text-xs sm:text-sm font-bold text-white leading-tight">Techashi Solutions Ltd.</h1>
          <p class="text-[11px] text-slate-400 font-medium leading-none">Official Corporate Profile • 2026 Edition</p>
        </div>
      </div>
    </div>

    <!-- Center: Status Pill (Tablet & Desktop) -->
    <div class="hidden lg:flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800/60 border border-slate-700 text-xs text-slate-300">
      <span class="w-2 h-2 rounded-full bg-brand-green animate-pulse"></span>
      <span class="font-medium">Original Verified PDF Document</span>
      <span class="text-slate-500">•</span>
      <span class="text-slate-400">7 Pages</span>
    </div>

    <!-- Right: Document Actions -->
    <div class="flex items-center gap-2 sm:gap-2.5">
      <!-- Open Raw in New Window -->
      <a href="assets/Techashi_Solutions_Company_Profile_2026.pdf" target="_blank" rel="noopener noreferrer" class="px-2.5 sm:px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/10 transition-colors inline-flex items-center gap-1.5 border border-slate-700/80" title="Open PDF directly in new tab">
        <i data-lucide="external-link" class="w-3.5 h-3.5 text-sky-400"></i>
        <span class="hidden sm:inline">Open in Tab</span>
      </a>

      <!-- Download Button -->
      <a href="assets/Techashi_Solutions_Company_Profile_2026.pdf" download="Techashi_Solutions_Company_Profile_2026.pdf" class="px-3 sm:px-4 py-1.5 rounded-xl text-xs font-bold text-brand-blue-deep bg-brand-green hover:bg-brand-green-dark transition-all inline-flex items-center gap-1.5 shadow-sm hover:shadow" title="Download official PDF copy">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>Download <span class="hidden sm:inline">PDF</span></span>
      </a>

      <!-- Print Button -->
      <button onclick="printPdf()" class="hidden md:inline-flex px-2.5 py-1.5 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/10 transition-colors items-center gap-1.5 border border-slate-700/80" title="Print document">
        <i data-lucide="printer" class="w-3.5 h-3.5"></i>
        <span>Print</span>
      </button>
    </div>
  </header>

  <!-- Main PDF Viewer Canvas -->
  <main class="flex-1 w-full h-[calc(100%-3.5rem)] sm:h-[calc(100%-4rem)] bg-slate-900 relative">
    <iframe id="pdfFrame" src="assets/Techashi_Solutions_Company_Profile_2026.pdf#toolbar=1&navpanes=0&view=FitH" class="w-full h-full border-0" title="Techashi Solutions Official Company Profile 2026">
      <!-- Fallback for older browsers -->
      <div class="h-full flex flex-col items-center justify-center p-8 text-center text-slate-300">
        <div class="w-16 h-16 rounded-2xl bg-brand-green/20 text-brand-green flex items-center justify-center mb-4">
          <i data-lucide="file-text" class="w-8 h-8"></i>
        </div>
        <h2 class="text-xl font-bold text-white mb-2">Techashi Solutions Official Company Profile (2026)</h2>
        <p class="text-sm text-slate-400 max-w-md mb-6">Your browser does not automatically display embedded PDFs in the page frame.</p>
        <a href="assets/Techashi_Solutions_Company_Profile_2026.pdf" target="_blank" class="px-6 py-3 rounded-xl font-bold text-sm text-brand-blue-deep bg-brand-green hover:bg-brand-green-dark transition-colors inline-flex items-center gap-2">
          <i data-lucide="external-link" class="w-4 h-4"></i>
          <span>Open Company Profile PDF Directly</span>
        </a>
      </div>
    </iframe>
  </main>

  <script>
    // Initialize icons
    lucide.createIcons();

    // Print helper
    function printPdf() {
      const frame = document.getElementById('pdfFrame');
      try {
        if (frame && frame.contentWindow) {
          frame.contentWindow.focus();
          frame.contentWindow.print();
          return;
        }
      } catch (e) {
        // Fallback for cross-origin or sandbox restrictions
      }
      window.open('assets/Techashi_Solutions_Company_Profile_2026.pdf', '_blank');
    }
  </script>
</body>
</html>
